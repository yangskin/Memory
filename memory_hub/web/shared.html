<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共享记忆 · Memory Hub</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-soft: #fbfcff;
    --line: #e3e8f2;
    --ink: #1c2333;
    --muted: #6b7590;
    --brand: #4f6ef7;
    --brand-soft: #eef1ff;
    --ok: #17a05e;
    --warn: #d9822b;
    --err: #d64545;
    --shared: #4f6ef7;
    --proj: #7a5af5;
    --org: #0e9f9f;
    --graph-edge: #aeb8cc;
    --graph-grid: #e8edf7;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  [data-theme="dark"] {
    --bg: #111827;
    --card: #1b2435;
    --card-soft: #202b3d;
    --line: #334155;
    --ink: #edf2fb;
    --muted: #9aa8bd;
    --brand-soft: #26345c;
    --graph-edge: #65738c;
    --graph-grid: #263247;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  }
  header.topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px; background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
  .project-id { color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .status .pill {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: #eef0f5; color: var(--muted);
  }
  .status .pill.ok { background: #e5f7ee; color: var(--ok); }
  .status .pill.err { background: #fdeaea; color: var(--err); }
  .status .pill.busy { background: #fdf3e4; color: var(--warn); }
  .tokenbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 22px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .tokenbar label { font-size: 13px; color: var(--muted); }
  .tokenbar input {
    flex: 1; min-width: 260px; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 8px; font-family: var(--mono); font-size: 13px; background: var(--card-soft); color: var(--ink);
  }
  button {
    border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    background: var(--brand); color: #fff; cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  button.ghost { background: #eef0f5; color: var(--ink); }
  [data-theme="dark"] button.ghost { background: #2b3850; }
  button:disabled { opacity: .55; cursor: default; }
  main { max-width: 1200px; margin: 0 auto; padding: 22px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .tabs { max-width: 1200px; margin: 18px auto 0; padding: 0 22px; display: flex; gap: 6px; align-items: center; }
  .tab { color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 9px 9px 0 0; padding: 10px 16px; }
  .tab.active { color: var(--brand); background: var(--card); border-color: var(--line); border-bottom-color: var(--card); }
  .tab-panel { display: none; }
  .tab-panel.active { display: contents; }
  .theme-btn { margin-left: auto; min-width: 42px; padding: 8px 11px; }
  [data-theme="dark"] .status .pill { background: #2b3850; }
  [data-theme="dark"] .brief-summary { border-color: #354675; }
  [data-theme="dark"] .conclusion, [data-theme="dark"] .board-thread { background: var(--card-soft); }
  [data-theme="dark"] .board-thread .thread-head { background: #273348; }
  [data-theme="dark"] .event .body pre, [data-theme="dark"] .event .body code,
  [data-theme="dark"] .board-post .body pre, [data-theme="dark"] .board-post .body code { background: #111827; }
  .task-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
  .task-toolbar input, .task-toolbar select { min-width: 170px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card-soft); color: var(--ink); font-size: 13px; }
  .task-toolbar input { flex: 1 1 260px; }
  .task-dashboard { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 14px 0 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .task-metric { min-height: 66px; padding: 10px 12px; border-right: 1px solid var(--line); background: var(--card-soft); }
  .task-metric:last-child { border-right: 0; }
  .task-metric.open { border-top: 3px solid var(--brand); }
  .task-metric.active { border-top: 3px solid #0e9f9f; }
  .task-metric.blocked { border-top: 3px solid var(--warn); }
  .task-metric.review { border-top: 3px solid #b06ad4; }
  .task-metric.closed { border-top: 3px solid #8a93a8; }
  .task-metric-label { color: var(--muted); font-size: 12px; }
  .task-metric-value { margin-top: 2px; color: var(--ink); font-family: var(--mono); font-size: 23px; font-weight: 700; }
  .task-queue { min-width: 0; margin-top: 2px; }
  .task-state-columns { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .task-state-column { min-width: 220px; border: 1px solid var(--line); border-top: 3px solid var(--brand); border-radius: 8px; overflow: hidden; background: var(--card-soft); }
  .task-state-column.active { border-top-color: #0e9f9f; }
  .task-state-column.blocked { border-top-color: var(--warn); }
  .task-state-column.review { border-top-color: #b06ad4; }
  .task-state-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 700; }
  .task-state-count { font-family: var(--mono); color: var(--ink); }
  .task-state-list { display: grid; gap: 8px; min-height: 104px; padding: 9px; }
  .task-card { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--card); color: var(--ink); text-align: left; }
  .task-card:hover { border-color: var(--brand); filter: none; }
  .task-card.selected { border-color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); }
  .task-card-title { display: -webkit-box; overflow: hidden; color: var(--ink); font-size: 13px; font-weight: 700; line-height: 1.4; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .task-card-meta, .task-card-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; color: var(--muted); font-size: 11px; }
  .task-card-footer { justify-content: space-between; }
  .task-chip { padding: 1px 6px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-family: var(--mono); font-size: 10px; }
  .task-card-note { min-height: 16px; margin-top: 7px; color: var(--ink); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-closed { margin-top: 12px; border-top: 1px solid var(--line); }
  .task-closed summary { padding: 11px 0; color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; }
  .task-closed-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding-bottom: 4px; }
  .task-workspace-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, 0.38fr); gap: 16px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .task-main { min-width: 0; }
  .task-side { min-width: 0; border-left: 1px solid var(--line); padding-left: 16px; }
  .task-side h3, .task-timeline h3, .task-lineage h3 { margin: 0 0 9px; color: var(--muted); font-size: 12px; font-weight: 700; }
  .agent-summary { display: grid; gap: 7px; }
  .agent-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .agent-row:last-child { border-bottom: 0; }
  .agent-row .agent-id { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
  .agent-row .agent-count { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .task-detail { min-height: 120px; }
  .task-detail-empty { color: var(--muted); font-size: 13px; }
  .task-detail-title { margin: 0 0 10px; color: var(--ink); font-size: 15px; }
  .task-detail dl { display: grid; gap: 6px; margin: 0; }
  .task-detail dl > div { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
  .task-detail dt { color: var(--muted); font-size: 12px; }
  .task-detail dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
  .task-lineage { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .task-lineage-canvas { height: min(42vh, 420px); min-height: 290px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background-color: var(--card-soft); background-image: radial-gradient(var(--graph-grid) 1px, transparent 1px); background-size: 18px 18px; }
  .task-lineage-canvas .empty, .task-lineage-canvas .errorbox { margin: 18px; }
  .task-timeline { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .task-events { display: grid; gap: 7px; max-height: 310px; overflow: auto; padding-right: 3px; }
  .task-event { display: grid; grid-template-columns: 11px minmax(0, 1fr); gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .task-event:last-child { border-bottom: 0; }
  .task-event-dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--brand); }
  .task-event-title { font-family: var(--mono); font-size: 12px; font-weight: 700; }
  .task-event-meta { margin-top: 2px; color: var(--muted); font-size: 12px; }
  .task-event-summary { margin-top: 3px; font-size: 13px; overflow-wrap: anywhere; }
  @media (max-width: 900px) { .task-workspace-grid { grid-template-columns: 1fr; } .task-side { border-left: 0; border-top: 1px solid var(--line); padding: 14px 0 0; } }
  @media (max-width: 620px) {
    header.topbar, .tokenbar, .tabs, main { padding-left: 14px; padding-right: 14px; }
    .card { padding: 16px 14px; }
    .tokenbar input, .task-toolbar input, .task-toolbar select { width: 100%; min-width: 0; flex-basis: 100%; }
    .task-dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .task-metric:nth-child(2) { border-right: 0; }
    .task-metric:nth-child(3) { border-top: 1px solid var(--line); }
    .task-lineage-canvas { min-height: 250px; }
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
  .empty { color: var(--muted); text-align: center; padding: 26px 0; font-size: 13px; }
  .stale-note { color: var(--warn); font-size: 12px; padding: 4px 0 10px; }
  .brief-summary {
    background: var(--brand-soft); border: 1px solid #dde3ff; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px;
  }
  .brief-summary p { margin: 0; }
  .brief-section { margin: 14px 0; }
  .brief-section h3 {
    margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .brief-section h3 .count {
    font-size: 11px; color: var(--muted); background: #eef0f5; border-radius: 999px; padding: 1px 8px;
  }
  .conclusion {
    border: 1px solid var(--line); border-left: 3px solid var(--brand);
    border-radius: 8px; padding: 9px 12px; margin: 6px 0; background: #fbfcff;
  }
  .conclusion .conclusion-title { margin: 0; font-weight: 600; }
  .conclusion .conclusion-desc { margin: 4px 0 0; color: #3a4360; }
  .source-badge { font-size: 11px; color: var(--muted); background: #eef0f5; padding: 1px 8px; border-radius: 999px; }
  .event {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0;
  }
  .event .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .scope-tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: #fff; }
  .scope-tag.shared { background: var(--shared); }
  .scope-tag.project_shared { background: var(--proj); }
  .scope-tag.org_shared { background: var(--org); }
  .event .who { font-family: var(--mono); font-size: 12px; }
  .event .when { margin-left: auto; white-space: nowrap; }
  .event .body { margin-top: 7px; font-size: 14px; }
  .event .body p { margin: 4px 0; }
  .event .body pre { background: #f1f3f9; border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; }
  .event .body code { background: #f1f3f9; border-radius: 4px; padding: 1px 4px; font-family: var(--mono); font-size: 12px; }
  .freshness { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .freshness b { color: var(--ink); font-family: var(--mono); }
  .errorbox {
    background: #fdeaea; color: var(--err); border: 1px solid #f5c6c6;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px;
  }
  a { color: var(--brand); }

  /* ---- full board ---- */
  .board-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 12px; font-size: 13px; color: var(--muted);
  }
  .board-toolbar .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .board-toolbar .count { background: #eef0f5; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .board-toolbar .count b { font-family: var(--mono); }
  .board-toolbar .count.open b { color: var(--warn); }
  .board-toolbar .count.resolved b { color: var(--ok); }
  .board-toolbar select, .board-toolbar input[type=search] {
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font-size: 13px; background: #fbfcff; color: var(--ink);
  }
  .board-thread {
    border: 1px solid var(--line); border-radius: 12px; margin: 10px 0;
    overflow: hidden; background: #fbfcff;
  }
  .board-thread .thread-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    font-size: 12px; color: var(--muted); background: #f1f3f9; border-bottom: 1px solid var(--line);
  }
  .board-post { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .board-post:last-child { border-bottom: 0; }
  .board-post.reply { padding-left: 28px; background: #f8fafd; }
  .board-post .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .type-tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: #fff; }
  .type-tag.question { background: #4f6ef7; }
  .type-tag.request { background: #7a5af5; }
  .type-tag.warning { background: #d9822b; }
  .type-tag.handoff { background: #0e9f9f; }
  .type-tag.proposal { background: #b06ad4; }
  .type-tag.note { background: #6b7590; }
  .type-tag.reply { background: #8a93a8; }
  .status-tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .status-tag.open { background: #fdf3e4; color: #b26a16; }
  .status-tag.resolved { background: #e5f7ee; color: var(--ok); }
  .board-post .who { font-family: var(--mono); font-size: 12px; }
  .board-post .when { margin-left: auto; white-space: nowrap; }
  .board-post .body { margin-top: 7px; font-size: 14px; }
  .board-post .body p { margin: 4px 0; }
  .board-post .body pre { background: #f1f3f9; border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; }
  .board-post .body code { background: #f1f3f9; border-radius: 4px; padding: 1px 4px; font-family: var(--mono); font-size: 12px; }
  .board-empty { color: var(--muted); text-align: center; padding: 26px 0; font-size: 13px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>共享记忆面板 <span class="project-id" id="projectId">—</span></div>
  <div class="status">
    <button class="ghost theme-btn" id="themeBtn" title="切换深色模式" aria-label="切换深色模式">☾</button>
    <span class="pill" id="statusPill">未连接</span>
    <span id="lastUpdated">—</span>
  </div>
</header>

<div class="tokenbar">
  <label for="token">只读 Token（<code>context:read</code>，仅存本浏览器会话）</label>
  <input id="token" type="password" autocomplete="off" placeholder="mem_v1.tok_….…" spellcheck="false">
  <button id="connectBtn">连接</button>
  <button class="ghost" id="refreshBtn" disabled>立即刷新</button>
  <button class="ghost" id="clearBtn">清空</button>
</div>

<nav class="tabs" aria-label="主导航">
  <button class="tab active" data-tab="boardPanel">留言板</button>
  <button class="tab" data-tab="taskPanel">任务工作区</button>
  <button class="tab" data-tab="sharedPanel">共享记忆</button>
</nav>

<main>
  <div class="tab-panel active" id="boardPanel">
  <section class="card" id="boardCard" style="grid-column:1 / -1">
    <h2>最近留言 <span class="source-badge">实时</span></h2>
    <div class="board-toolbar">
      <span>按状态筛选</span>
      <select id="boardFilter">
        <option value="all">全部</option>
        <option value="open">未解决</option>
        <option value="resolved">已解决</option>
      </select>
      <input type="search" id="boardSearch" placeholder="搜索留言内容 / 任务 / 作者" autocomplete="off">
      <div class="counts">
        <span class="count">全部 <b id="boardTotal">0</b></span>
        <span class="count open">未解决 <b id="boardOpen">0</b></span>
        <span class="count resolved">已解决 <b id="boardResolved">0</b></span>
      </div>
    </div>
    <div id="boardArea"><div class="board-empty">连接后自动加载最近留言。</div></div>
  </section>
  </div>

  <div class="tab-panel" id="taskPanel">
  <section class="card" style="grid-column:1 / -1">
    <h2>任务工作队列 <span class="source-badge" id="taskFreshness">未连接</span></h2>
    <div class="task-toolbar">
      <input id="taskSearch" type="search" placeholder="搜索任务标题、目标或编号" autocomplete="off">
      <select id="taskStateFilter" aria-label="任务状态筛选">
        <option value="all">全部进行中状态</option>
        <option value="open">待处理</option>
        <option value="active">进行中</option>
        <option value="blocked">受阻</option>
        <option value="review">审查中</option>
      </select>
      <input id="taskAgentFilter" type="search" placeholder="按 Agent ID 筛选" autocomplete="off">
      <button id="taskRefreshBtn" disabled>刷新任务</button>
      <span id="taskStats">—</span>
    </div>
    <div class="task-dashboard" aria-label="任务概览">
      <div class="task-metric open"><div class="task-metric-label">待处理</div><div class="task-metric-value" id="taskOpenCount">0</div></div>
      <div class="task-metric active"><div class="task-metric-label">进行中</div><div class="task-metric-value" id="taskActiveCount">0</div></div>
      <div class="task-metric blocked"><div class="task-metric-label">受阻</div><div class="task-metric-value" id="taskBlockedCount">0</div></div>
      <div class="task-metric review"><div class="task-metric-label">待审核</div><div class="task-metric-value" id="taskReviewCount">0</div></div>
      <div class="task-metric closed"><div class="task-metric-label">已结束</div><div class="task-metric-value" id="taskClosedCount">0</div></div>
    </div>
    <div class="task-queue" id="taskBoard"><div class="empty">连接后加载任务队列。</div></div>
    <details class="task-closed" id="taskClosedGroup" hidden>
      <summary id="taskClosedSummary">已结束</summary>
      <div class="task-closed-list" id="taskClosedList"></div>
    </details>
    <div class="task-workspace-grid">
      <section class="task-main">
        <div class="task-detail" id="taskDetail"><div class="task-detail-empty">选择一个任务查看状态、提交和审核信息。</div></div>
        <div class="task-lineage">
          <h3>任务轨迹</h3>
          <div class="task-lineage-canvas" id="taskLineageArea"><div class="empty">选择任务后显示依赖与交付轨迹。</div></div>
        </div>
      </section>
      <aside class="task-side">
        <h3>Agent 负载</h3>
        <div class="agent-summary" id="taskAgents"><div class="empty">暂无 Agent 节点。</div></div>
        <div class="task-timeline">
          <h3>任务事件</h3>
          <div class="task-events" id="taskEvents"><div class="empty">暂无 Task Event。</div></div>
        </div>
      </aside>
    </div>
  </section>
  </div>

  <div class="tab-panel" id="sharedPanel">

<script src="/assets/cytoscape.min.js"></script>
<script>
(function () {

  function hasFeedBrief(feed) {

  function showStaleFeedNote(area) {

  function setPill(state, text) {

  function fmtTime(iso) {
    if (!iso) return "—";

  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function inlineFormat(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function renderMarkdown(src) {
    var parts = esc(src).split(/```/);
    var out = "";
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) { out += "<pre><code>" + parts[i].trim() + "</code></pre>"; continue; }
      var inList = false;
      var lines = parts[i].split("\n");
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j];
        var m = line.match(/^(#{1,6})\s+(.*)$/);
        if (m) { var h = Math.min(m[1].length, 4); out += "<h" + h + ">" + inlineFormat(m[2]) + "</h" + h + ">"; continue; }
        m = line.match(/^\s*[-*]\s+(.*)$/);
        if (m) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inlineFormat(m[1]) + "</li>"; continue; }
        if (inList) { out += "</ul>"; inList = false; }
        if (!line.trim()) continue;
        out += "<p>" + inlineFormat(line) + "</p>";
      }
      if (inList) out += "</ul>";

    return out;
  }
  function pickText(item, keys) {

  function renderConclusion(item) {

    var html = '<div class="conclusion">';
    if (title) html += '<p class="conclusion-title">' + inlineFormat(title) + "</p>";
    if (desc) html += '<div class="conclusion-desc">' + renderMarkdown(desc) + "</div>";

  }
  var SECTION_LABELS = [

    ["cross_cutting_changes", "跨领域变更"],

  function scopeClass(s) {

  function renderEvent(ev) {

  function renderFeed(feed) {

  function typeClass(t) {
    var v = String(t || "").toLowerCase();
    return ["question", "request", "warning", "handoff", "proposal", "note", "reply"].indexOf(v) >= 0 ? v : "note";
  }
  function boardMetaTag(cls, text) {
    return '<span class="' + cls + '">' + esc(text) + "</span>";
  }
  function renderBoardPost(post, isRoot) {
    var html = '<div class="board-post' + (isRoot ? "" : " reply") + '">';
    html += '<div class="meta">';
    html += boardMetaTag("type-tag " + typeClass(post.post_type), post.post_type);
    html += boardMetaTag("status-tag " + (post.status === "resolved" ? "resolved" : "open"), post.status === "resolved" ? "已解决" : "未解决");
    html += '<span class="who">' + esc(post.author_user_id || "?") + "</span>";

    html += "</div>";
    if (post.content) html += '<div class="body">' + renderMarkdown(post.content) + "</div>";
    html += "</div>";
    return html;
  }
  function boardMatches(post, statusFilter, query) {
    if (statusFilter === "open" && post.status !== "open") return false;
    if (statusFilter === "resolved" && post.status !== "resolved") return false;
    if (query) {
      var q = query.toLowerCase();
      var hay = [post.content, post.task_id, post.author_user_id, post.author_agent_id, post.post_type]
        .join(" ").toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }
  function renderBoard(data) {
    window.__boardCache = data;
    var area = document.getElementById("boardArea");
    var items = (data && data.items) || [];
    var statusFilter = document.getElementById("boardFilter").value;
    var query = document.getElementById("boardSearch").value.trim();
    var filtered = items.filter(function (it) { return boardMatches(it, statusFilter, query); });

    document.getElementById("boardTotal").textContent = items.length;
    document.getElementById("boardOpen").textContent = items.filter(function (it) { return it.status === "open"; }).length;
    document.getElementById("boardResolved").textContent = items.filter(function (it) { return it.status === "resolved"; }).length;

    if (!items.length) {
      area.innerHTML = '<div class="board-empty">留言板为空 · 有新留言时会自动出现。</div>';
      return;
    }
    if (!filtered.length) {
      area.innerHTML = '<div class="board-empty">没有符合当前筛选的留言。</div>';
      return;
    }

    var byThread = {};
    filtered.forEach(function (it) {
      var tid = it.thread_id || it.post_id;
      (byThread[tid] = byThread[tid] || []).push(it);
    });
    var html = "";
    Object.keys(byThread).forEach(function (tid) {
      var posts = byThread[tid].slice().sort(function (a, b) {
        return (a.created_at < b.created_at ? -1 : 1);
      });
      var root = posts[0];
      html += '<div class="board-thread">';
      html += '<div class="thread-head">线程 ' + esc(tid) + " · " + posts.length + " 条</div>";

      html += "</div>";
    });
    area.innerHTML = html;
  }
  var TASK_COLORS = { task: "#2f6fed", agent: "#0e9f9f", attempt: "#d9822b", submission: "#b06ad4", review: "#17a05e", asset: "#6b7590" };
  var TASK_SHAPES = { task: "round-rectangle", agent: "ellipse", attempt: "diamond", submission: "hexagon", review: "round-rectangle", asset: "round-rectangle" };
  var TASK_LABELS = { task: "任务", agent: "Agent", attempt: "Attempt", submission: "提交", review: "审查", asset: "产出" };
  var TASK_STATES = [
    { key: "open", label: "待处理" },
    { key: "active", label: "进行中" },
    { key: "blocked", label: "受阻" },
    { key: "review", label: "审查中" }
  ];
  var selectedTaskId = null;
  function destroyTaskLineage() {
    if (taskLineage) { taskLineage.destroy(); taskLineage = null; }
  }
  function taskNodeLabel(node) {
    var value = String(node.name || node.key || node.type || "");
    return value.length > 23 ? value.slice(0, 21) + "..." : value;
  }
  function taskEventSummary(event) {
    var payload = event.payload || {};
    return payload.summary || payload.reason || payload.title || payload.decision || payload.attempt_id || "";
  }
  function taskTime(value) {
    var time = Date.parse(value || "");
    return isNaN(time) ? 0 : time;
  }
  function newest(items, value) {
    return items.slice().sort(function (left, right) { return taskTime(value(right)) - taskTime(value(left)); })[0] || null;
  }
  function relativeTime(iso) {
    if (!iso) return "暂无更新";
    var delta = Math.max(0, Date.now() - taskTime(iso));
    if (delta < 60000) return "刚刚更新";
    if (delta < 3600000) return Math.floor(delta / 60000) + " 分钟前";
    if (delta < 86400000) return Math.floor(delta / 3600000) + " 小时前";
    return Math.floor(delta / 86400000) + " 天前";
  }
  function buildTaskRecords(bundle, history) {
    var nodes = (bundle && bundle.nodes) || [];
    var events = (history && history.events) || [];
    var eventsByTask = {};
    events.forEach(function (event) { (eventsByTask[event.task_id] = eventsByTask[event.task_id] || []).push(event); });
    return nodes.filter(function (node) {
      return node.type === "task" && !(node.metadata && node.metadata.external);
    }).map(function (node) {
      var metadata = node.metadata || {};
      var attempts = nodes.filter(function (item) { return item.type === "attempt" && item.metadata && item.metadata.task_id === node.key; });
      var submissions = nodes.filter(function (item) { return item.type === "submission" && item.metadata && item.metadata.task_id === node.key; });
      var reviews = nodes.filter(function (item) { return item.type === "review" && item.metadata && item.metadata.task_id === node.key; });
      var currentAttempt = attempts.filter(function (item) { return item.key === metadata.current_attempt; })[0] || newest(attempts, function (item) { return item.metadata.created_at; });
      var latestSubmission = newest(submissions, function (item) { return item.metadata.created_at; });
      var latestReview = newest(reviews, function (item) { return item.metadata.created_at; });
      var latestEvent = newest(eventsByTask[node.key] || [], function (item) { return item.occurred_at; });
      return {
        id: node.id,
        key: node.key,
        title: node.name || node.key,
        metadata: metadata,
        state: metadata.state || "open",
        priority: metadata.priority || "normal",
        currentAttempt: currentAttempt,
        latestSubmission: latestSubmission,
        latestReview: latestReview,
        updatedAt: latestEvent ? latestEvent.occurred_at : metadata.updated_at || metadata.created_at || ""
      };
    }).sort(function (left, right) { return taskTime(right.updatedAt) - taskTime(left.updatedAt); });
  }
  function taskMatches(record, ignoreState) {
    var query = document.getElementById("taskSearch").value.trim().toLowerCase();
    var state = document.getElementById("taskStateFilter").value;
    var agent = document.getElementById("taskAgentFilter").value.trim().toLowerCase();
    var assignee = record.currentAttempt && record.currentAttempt.metadata ? record.currentAttempt.metadata.assignee || "" : "";
    var text = [record.title, record.key, record.metadata.objective, record.metadata.acceptance, record.priority, assignee].join(" ").toLowerCase();
    if (query && text.indexOf(query) < 0) return false;
    if (agent && assignee.toLowerCase().indexOf(agent) < 0) return false;
    return ignoreState || state === "all" || record.state === state;
  }
  function isClosedTask(record) {

  function renderTaskDashboard(records) {

  function taskCard(record) {

      '<span class="task-card-note">' + esc(attempt.assignee || "未分配") + '</span>' +

  function renderTaskDetail(record) {

    ].filter(function (field) { return field[1] !== undefined && field[1] !== null && field[1] !== ""; });
    var html = '<h3 class="task-detail-title">' + esc(record.title) + '</h3><dl>';

  function renderTaskAgents(records) {

    }).join("");
  }
  function taskLineageData(bundle, record) {
    var nodes = (bundle && bundle.nodes) || [], edges = (bundle && bundle.edges) || [];
    var selected = {}, selectedEdges = [];
    function include(edge) {
      if (selectedEdges.indexOf(edge) >= 0) return;
      selectedEdges.push(edge);
      selected[edge.source] = true;
      selected[edge.target] = true;
    }
    selected[record.id] = true;
    edges.forEach(function (edge) { if (edge.source === record.id || edge.target === record.id) include(edge); });
    var attemptIds = {};
    nodes.forEach(function (node) { if (node.type === "attempt" && node.metadata && node.metadata.task_id === record.key) { attemptIds[node.id] = true; selected[node.id] = true; } });
    edges.forEach(function (edge) { if (attemptIds[edge.source] && ["assigned_to", "assigned_by", "has_submission"].indexOf(edge.relation_type) >= 0) include(edge); });
    var submissionIds = {};
    nodes.forEach(function (node) { if (node.type === "submission" && node.metadata && node.metadata.task_id === record.key) { submissionIds[node.id] = true; selected[node.id] = true; } });
    edges.forEach(function (edge) { if (submissionIds[edge.source] && edge.relation_type === "has_review") include(edge); });
    var reviewIds = {};
    nodes.forEach(function (node) { if (node.type === "review" && node.metadata && node.metadata.task_id === record.key) { reviewIds[node.id] = true; selected[node.id] = true; } });
    edges.forEach(function (edge) { if (reviewIds[edge.source] && edge.relation_type === "reviewed_by") include(edge); });
    return { nodes: nodes.filter(function (node) { return selected[node.id]; }), edges: selectedEdges };
  }
  function renderTaskLineage(bundle, record) {
    var area = document.getElementById("taskLineageArea");
    destroyTaskLineage();
    if (!record) { area.innerHTML = '<div class="empty">选择任务后显示依赖与交付轨迹。</div>'; return; }
    var lineage = taskLineageData(bundle, record);
    if (!lineage.nodes.length) { area.innerHTML = '<div class="empty">该任务尚无可视关系。</div>'; return; }
    area.innerHTML = "";
    var styles = getComputedStyle(document.documentElement);
    var elements = lineage.nodes.map(function (node) {
      return { data: { id: node.id, label: taskNodeLabel(node), type: node.type, key: node.key, color: TASK_COLORS[node.type] || "#6b7590", shape: TASK_SHAPES[node.type] || "round-rectangle" } };
    });
    lineage.edges.forEach(function (edge, index) {
      elements.push({ data: { id: "lineage-edge-" + index, source: edge.source, target: edge.target, relation: edge.relation_type } });
    });
    taskLineage = cytoscape({
      container: area,
      elements: elements,
      minZoom: 0.2,
      maxZoom: 2.5,
      style: [
        { selector: "node", style: { "background-color": "data(color)", "shape": "data(shape)", "border-color": styles.getPropertyValue("--card").trim(), "border-width": 2, "color": "#fff", "font-size": 10, "font-weight": 600, "height": 40, "label": "data(label)", "text-halign": "center", "text-valign": "center", "text-wrap": "ellipsis", "text-max-width": 102, "width": 122 } },
        { selector: "node[type = 'task']", style: { "height": 52, "width": 158, "font-size": 12 } },
        { selector: "edge", style: { "curve-style": "bezier", "line-color": styles.getPropertyValue("--graph-edge").trim(), "target-arrow-color": styles.getPropertyValue("--graph-edge").trim(), "target-arrow-shape": "triangle", "arrow-scale": 0.7, "width": 1.4, "opacity": 0.72 } }
      ],
      layout: { name: "breadthfirst", directed: true, animate: false, padding: 32, spacingFactor: 1.15 }
    });
    taskLineage.on("tap", "node", function (event) {
      var task = (window.__taskRecords || []).filter(function (recordItem) { return recordItem.id === event.target.id(); })[0];
      if (task) selectTask(task.id);
    });
  }
  function renderTaskWorkspace(bundle, history) {
    var records = buildTaskRecords(bundle, history);
    window.__taskRecords = records;
    renderTaskDashboard(records);
    var visible = records.filter(function (record) { return !isClosedTask(record) && taskMatches(record, false); });
    var closed = records.filter(function (record) { return isClosedTask(record) && taskMatches(record, true); });
    var selected = records.filter(function (record) { return record.id === selectedTaskId; })[0];
    if (!selected || (!isClosedTask(selected) && !visible.some(function (record) { return record.id === selected.id; }))) selected = visible[0] || closed[0] || null;
    selectedTaskId = selected ? selected.id : null;
    var board = document.getElementById("taskBoard");
    board.innerHTML = '<div class="task-state-columns">' + TASK_STATES.map(function (state) {
      var entries = visible.filter(function (record) { return record.state === state.key; });
      return '<section class="task-state-column ' + state.key + '"><div class="task-state-head"><span>' + state.label + '</span><span class="task-state-count">' + entries.length + '</span></div><div class="task-state-list">' + (entries.length ? entries.map(taskCard).join("") : '<div class="empty">暂无任务</div>') + '</div></section>';
    }).join("") + '</div>';
    var closedGroup = document.getElementById("taskClosedGroup");
    closedGroup.hidden = !closed.length;
    document.getElementById("taskClosedSummary").textContent = "已结束 · " + closed.length;
    document.getElementById("taskClosedList").innerHTML = closed.map(taskCard).join("");
    document.getElementById("taskStats").textContent = visible.length + " 项在办 · " + closed.length + " 项已结束";
    document.getElementById("taskFreshness").textContent = bundle && bundle.cursor ? "事件 #" + bundle.cursor : "已同步";
    renderTaskDetail(selected);
    renderTaskAgents(records);
    renderTaskEvents(history, selected);
    renderTaskLineage(bundle, selected);
    board.querySelectorAll("[data-task-id]").forEach(function (card) {
      card.addEventListener("click", function () { selectTask(card.dataset.taskId); });
    });
    document.getElementById("taskClosedList").querySelectorAll("[data-task-id]").forEach(function (card) {
      card.addEventListener("click", function () { selectTask(card.dataset.taskId); });
    });
  }
  function selectTask(taskId) {
    selectedTaskId = taskId;
    if (window.__taskGraphCache && window.__taskHistoryCache) renderTaskWorkspace(window.__taskGraphCache, window.__taskHistoryCache);
  }
  function fetchTaskWorkspace() {
    var token = tokenEl.value.trim(), currentProject = projectId.textContent.replace(/^·\s*/, "");
    if (!token || !currentProject || currentProject === "—") return;
    var base = "/v1/projects/" + encodeURIComponent(currentProject);
    var graphUrl = base + "/task-graph?max_nodes=200&max_edges=400";
    var eventUrl = base + "/task-events?max_items=200";
    Promise.all([
      fetch(graphUrl, { headers: { "Authorization": "Bearer " + token } }),
      fetch(eventUrl, { headers: { "Authorization": "Bearer " + token } })
    ]).then(function (responses) {
      if (responses[0].status !== 200) throw new Error("任务队列请求失败（HTTP " + responses[0].status + "）。");
      if (responses[1].status !== 200) throw new Error("任务事件请求失败（HTTP " + responses[1].status + "）。");
      return Promise.all([responses[0].json(), responses[1].json()]);
    }).then(function (payload) {
      window.__taskGraphCache = payload[0];
      window.__taskHistoryCache = payload[1];
      renderTaskWorkspace(payload[0], payload[1]);
    }).catch(function (err) {
      destroyTaskLineage();
      document.getElementById("taskBoard").innerHTML = '<div class="errorbox">任务队列加载失败：' + esc(err.message || err) + "</div>";
      document.getElementById("taskLineageArea").innerHTML = '<div class="errorbox">任务轨迹加载失败。</div>';
      document.getElementById("taskEvents").innerHTML = '<div class="errorbox">任务事件加载失败。</div>';
      document.getElementById("taskFreshness").textContent = "加载失败";
    });
  }
  function fetchBoard() {
    var token = tokenEl.value.trim();
    if (!token) return;
    fetch("/v1/shared-board", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ max_items: 50, include_content: true, include_references: true })
    }).then(function (resp) {
      if (resp.status === 200) return resp.json();
      if (resp.status === 401) throw new Error("Token 无效或已过期（401）。");
      if (resp.status === 403) throw new Error("Token 缺少 context:read 权限（403）。");
      if (resp.status === 429) throw new Error("请求过于频繁（429）。");
      throw new Error("服务错误（HTTP " + resp.status + "）。");
    }).then(function (data) {
      renderBoard(data);
    }).catch(function (err) {
      var area = document.getElementById("boardArea");
      area.innerHTML = '<div class="errorbox">留言板加载失败：' + esc(err && err.message ? err.message : String(err)) + "</div>";
    });
  }
  function showError(message) {
    var feedArea = document.getElementById("feedArea");
    feedArea.innerHTML = '<div class="errorbox">' + esc(message) + "</div>";
    setPill("err", "错误");
  }
  function fetchFeed() {
    var token = tokenEl.value.trim();
    if (!token) { showError("请先输入只读 Token。"); return; }
    setPill("busy", "请求中");
    fetch("/v1/shared-feed", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ max_age_minutes: 720, max_items: 50, include_content: true, include_brief_details: true })
    }).then(function (resp) {
      if (resp.status === 200) return resp.json();
      if (resp.status === 401) throw new Error("Token 无效或已过期（401）。");
      if (resp.status === 403) throw new Error("Token 缺少 context:read 权限（403）。");
      if (resp.status === 429) throw new Error("请求过于频繁（429）。");
      throw new Error("服务错误（HTTP " + resp.status + "）。");
    }).then(function (feed) {
      renderFeed(feed);
      schedule();
    }).catch(function (err) {
      showError(err && err.message ? err.message : String(err));
    });
  }
  function refreshAll() { fetchFeed(); fetchBoard(); }
  function schedule() {
    if (timer) clearInterval(timer);
    timer = setInterval(refreshAll, POLL_MS);
  }
  function connect() {
    var token = tokenEl.value.trim();
    if (!token) { showError("请先输入只读 Token。"); return; }
    try { sessionStorage.setItem(STORE_KEY, token); } catch (e) {}
    refreshBtn.disabled = false;
    document.getElementById("taskRefreshBtn").disabled = false;
    refreshAll();
  }
  function clearAll() {
    try {
      sessionStorage.removeItem(STORE_KEY);
      sessionStorage.removeItem(FEED_CACHE_KEY);
    } catch (e) {}
    hasBriefContent = false;
    hasFeedContent = false;
    tokenEl.value = "";
    if (timer) { clearInterval(timer); timer = null; }
    refreshBtn.disabled = true;
    projectId.textContent = "—";
    lastUpdated.textContent = "—";
    setPill("", "未连接");
    document.getElementById("briefArea").innerHTML = '<div class="empty">尚未连接 · 输入只读 Token 后点击「连接」。</div>';
    document.getElementById("feedArea").innerHTML = '<div class="empty">连接后每 30 秒自动刷新。</div>';
    document.getElementById("freshness").style.display = "none";
    document.getElementById("boardArea").innerHTML = '<div class="board-empty">连接后自动加载最近留言。</div>';
    document.getElementById("boardTotal").textContent = "0";
    document.getElementById("boardOpen").textContent = "0";
    document.getElementById("boardResolved").textContent = "0";
    destroyTaskLineage();
    selectedTaskId = null;
    window.__taskGraphCache = null;
    window.__taskHistoryCache = null;
    document.getElementById("taskBoard").innerHTML = '<div class="empty">连接后加载任务队列。</div>';
    document.getElementById("taskClosedGroup").hidden = true;
    document.getElementById("taskClosedList").innerHTML = "";
    document.getElementById("taskLineageArea").innerHTML = '<div class="empty">选择任务后显示依赖与交付轨迹。</div>';
    document.getElementById("taskEvents").innerHTML = '<div class="empty">暂无 Task Event。</div>';
    document.getElementById("taskAgents").innerHTML = '<div class="empty">暂无 Agent 节点。</div>';
    document.getElementById("taskStats").textContent = "—";
    document.getElementById("taskFreshness").textContent = "未连接";
    ["taskOpenCount", "taskActiveCount", "taskBlockedCount", "taskReviewCount", "taskClosedCount"].forEach(function (id) { document.getElementById(id).textContent = "0"; });
    renderTaskDetail(null);
  }
  connectBtn.addEventListener("click", connect);
  refreshBtn.addEventListener("click", refreshAll);
  clearBtn.addEventListener("click", clearAll);
  document.getElementById("taskRefreshBtn").addEventListener("click", fetchTaskWorkspace);
  document.getElementById("taskSearch").addEventListener("input", function () {
    if (window.__taskGraphCache) renderTaskWorkspace(window.__taskGraphCache, window.__taskHistoryCache);
  });
  document.getElementById("taskStateFilter").addEventListener("change", function () {
    if (window.__taskGraphCache) renderTaskWorkspace(window.__taskGraphCache, window.__taskHistoryCache);
  });
  document.getElementById("taskAgentFilter").addEventListener("input", function () {
    if (window.__taskGraphCache) renderTaskWorkspace(window.__taskGraphCache, window.__taskHistoryCache);
  });
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (item) { item.classList.remove("active"); });
      document.querySelectorAll(".tab-panel").forEach(function (panel) { panel.classList.remove("active"); });
      tab.classList.add("active");
      document.getElementById(tab.dataset.tab).classList.add("active");
      if (tab.dataset.tab === "taskPanel") {
        if (taskLineage) { taskLineage.resize(); taskLineage.fit(undefined, 32); }
        else fetchTaskWorkspace();
      }
    });
  });
  var themeBtn = document.getElementById("themeBtn");
  function setTheme(theme) { document.documentElement.dataset.theme = theme; themeBtn.textContent = theme === "dark" ? "☀" : "☾"; try { localStorage.setItem("memory_hub_theme", theme); } catch (e) {} if (window.__taskGraphCache) renderTaskWorkspace(window.__taskGraphCache, window.__taskHistoryCache); }
  themeBtn.addEventListener("click", function () { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); });
  tokenEl.addEventListener("keydown", function (e) { if (e.key === "Enter") connect(); });
  document.getElementById("boardFilter").addEventListener("change", function () {
    var last = window.__boardCache;
    if (last) renderBoard(last);
  });
  document.getElementById("boardSearch").addEventListener("input", function () {
    var last = window.__boardCache;
    if (last) renderBoard(last);
  });

  try {
    setTheme(localStorage.getItem("memory_hub_theme") || "light");
    var saved = sessionStorage.getItem(STORE_KEY);
    if (saved) { tokenEl.value = saved; refreshBtn.disabled = false; document.getElementById("taskRefreshBtn").disabled = false; refreshAll(); }
  } catch (e) {}
})();
</script>
</body>
</html>
